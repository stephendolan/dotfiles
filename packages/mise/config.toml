# https://mise.jdx.dev/configuration.html

[settings]
legacy_version_file = true                                    # Read .tool-versions files (asdf compatibility)
idiomatic_version_file_enable_tools = ["node", "ruby", "python", "go"]  # Read .ruby-version, .nvmrc, etc.
auto_install = true                                           # Install missing tools when entering a directory
trusted_config_paths = ["~"]                                  # Trust all configs under home (disable prompts)

[tools]
node = { version = "lts", auto_update = "1h" }
# Node CLIs as mise tools, not npm -g or corepack, so node upgrades cannot strand them
"aqua:openai/codex" = { version = "latest", auto_update = "1h" }
pnpm = { version = "latest", auto_update = "1h" }
yarn = { version = "latest", auto_update = "1h" }
python = { version = "3.13", auto_update = "1h" }
ruby = { version = "3.4", auto_update = "1h" }
go = { version = "1.22", auto_update = "1h" }
crystal = { version = "1.16", auto_update = "1h" }
rust = { version = "stable", auto_update = "1h" }

[bootstrap.services.mise-tool-update]
builtin = "tool-update"
